[tool:pytest]
addopts= --tb native -v -r fxX --maxfail=25 -p no:warnings
python_files=test_*.py
testpaths=test

[sqla_testing]
requirement_cls=sqlalchemy_mapepire.requirements:Requirements
profile_file=test/profiles.txt

[db]
# Set the URL with --dburi, or with "python scripts/runtests.py" which reads
# IBMI_HOSTNAME / IBMI_USERNAME / IBMI_PASSWORD from the environment.

[flake8]
max-line-length=88
extend-exclude=.venv
